<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pipeline Bio — Service Taxonomy</title>
<style>
  :root {
    --navy: #0349A2;
    --navy-dark: #022D66;
    --cyan: #08A2C0;
    --cyan-tint: #F0F8FA;
    --off-white: #F8F7FB;
    --ink: #0F172A;
    --slate: #475569;
    --slate-light: #94A3B8;
    --hairline: rgba(3, 73, 162, 0.10);
    --hairline-strong: rgba(3, 73, 162, 0.18);
    --row-hover: rgba(8, 162, 192, 0.06);

    --header-h: 0px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--off-white);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* ── HEADER ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--cyan-tint);
    border-bottom: 1px solid var(--hairline-strong);
    padding: env(safe-area-inset-top, 0) 0 0;
  }
  .header-inner {
    padding: 14px 16px 10px;
  }
  .wordmark {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--cyan);
    text-transform: uppercase;
  }
  h1 {
    margin: 5px 0 3px;
    font-size: 19px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -0.3px;
    line-height: 1.2;
  }
  .subtitle {
    margin: 0;
    color: var(--slate);
    font-size: 12px;
    line-height: 1.45;
  }

  /* ── STAT STRIP ── */
  .stat-strip {
    display: flex;
    margin: 10px 0 0;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    background: rgba(255,255,255,0.55);
    overflow: hidden;
  }
  .stat-cell {
    flex: 1 1 0;
    padding: 7px 8px;
    border-right: 1px solid var(--hairline);
    text-align: center;
  }
  .stat-cell:last-child { border-right: 0; }
  .stat-cell .v {
    font-size: 17px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1;
  }
  .stat-cell .l {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--slate);
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* ── JUMP CHIPS ── */
  .jumps-wrap {
    border-top: 1px solid var(--hairline);
    padding: 8px 16px;
    background: rgba(255,255,255,0.5);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .jumps-wrap::-webkit-scrollbar { display: none; }
  .l1-jumps {
    display: flex;
    gap: 6px;
    width: max-content;
  }
  .jump-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--navy);
    background: white;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    touch-action: manipulation;
    transition: background 0.12s;
  }
  .jump-chip:active { background: var(--cyan-tint); border-color: var(--cyan); }
  .jump-chip .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ── TREE ── */
  .tree-container {
    padding: 10px 0 80px;
  }

  .node { display: block; }

  .row {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 11px 16px 11px 16px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    min-height: 44px;
  }
  .row:active { background: var(--row-hover); }
  .row.is-leaf { cursor: default; }
  .row.is-match { background: var(--row-match); }

  .row-indent {
    flex: 0 0 auto;
  }

  .row-content {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .l1-bar {
    flex: 0 0 3px;
    align-self: stretch;
    border-radius: 2px;
    margin-right: 6px;
  }

  .toggle {
    flex: 0 0 22px;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    font-size: 10px;
    color: var(--slate-light);
    transition: transform 0.2s, color 0.15s;
    background: transparent;
  }
  .node.is-open > .row .toggle {
    transform: rotate(90deg);
    color: var(--cyan);
  }
  .is-leaf .toggle { visibility: hidden; }

  .label {
    flex: 1 1 auto;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.35;
    overflow-wrap: break-word;
    word-break: break-word;
    min-width: 0;
  }

  .meta {
    flex: 0 0 auto;
    margin-left: 6px;
  }
  .pill {
    display: inline-block;
    padding: 2px 7px;
    background: white;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    color: var(--slate);
    white-space: nowrap;
  }

  /* Depth styles */
  .node[data-depth="1"] > .row {
    padding-top: 13px; padding-bottom: 13px;
    border-bottom: 1px solid var(--hairline-strong);
    background: rgba(255,255,255,0.4);
  }
  .node[data-depth="1"] > .row .label {
    font-size: 16px; font-weight: 700; color: var(--navy);
  }
  .node[data-depth="2"] > .row .label {
    font-size: 14px; font-weight: 600; color: var(--navy);
  }
  .node[data-depth="3"] > .row .label {
    font-size: 13px; font-weight: 500; color: var(--ink);
  }
  .node[data-depth="4"] > .row .label {
    font-size: 12px; font-weight: 400; color: var(--slate);
  }

  /* Children indent */
  .children {
    display: none;
  }
  .node.is-open > .children { display: block; }
  .node.is-hidden { display: none; }

  /* Indent guide lines via row padding */
  .node[data-depth="2"] > .row { padding-left: 28px; }
  .node[data-depth="3"] > .row { padding-left: 44px; }
  .node[data-depth="4"] > .row { padding-left: 58px; }

  /* Depth line indicators */
  .node[data-depth="2"] > .row::before {
    content: '';
    position: absolute;
    left: 22px; top: 0; bottom: 0;
    width: 1px;
    background: var(--hairline);
  }

  /* Footer */
  .footer-note {
    padding: 24px 16px 40px;
    color: var(--slate);
    font-size: 11px;
    line-height: 1.5;
    text-align: center;
  }
  .footer-note a { color: var(--cyan); text-decoration: none; }

  /* Highlight */
  mark {
    background: #FFD878;
    color: var(--ink);
    padding: 0 1px;
    border-radius: 2px;
  }

  /* Bottom action bar */
  .action-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(248, 247, 251, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--hairline-strong);
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0));
    display: flex;
    gap: 8px;
    z-index: 99;
  }
  .action-btn {
    flex: 1;
    height: 40px;
    border: 1px solid var(--hairline-strong);
    border-radius: 10px;
    background: white;
    color: var(--navy);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.12s;
  }
  .action-btn:active { background: var(--cyan-tint); }

  /* Smooth scroll offset for sticky header */
  .scroll-anchor {
    scroll-margin-top: calc(var(--header-h) + 16px);
  }

  /* Prevent text selection during scroll on mobile */
  .tree-container { -webkit-user-select: none; user-select: none; }
</style>
</head>

<header class="header" id="mainHeader">
  <div class="header-inner">

    <p class="subtitle">Australia's scientific service classification. Tap any row to expand.</p>

      <div class="stat-cell"><div class="v">1,064</div><div class="l">Nodes</div></div>
    </div>
  </div>

  <div class="jumps-wrap">
    <div class="l1-jumps" id="l1Jumps"></div>
  </div>
</header>

<main class="tree-container">
  <div id="tree" role="tree"></div>
</main>

<p class="footer-note">
  This taxonomy underpins the Pipeline Bio Directory of Service Providers.<br>

</p>

<div class="action-bar">
  <button class="action-btn" id="expandAll">Expand all</button>
  <button class="action-btn" id="collapseAll">Collapse all</button>
</div>

const treeEl = document.getElementById('tree');
const allNodes = [];

function renderNode(data, depth, l1Name, l1Color) {
  const node = document.createElement('div');
  node.className = 'node';
  node.dataset.depth = depth;
  node.dataset.name = data.n;
  node.id = 'node-' + data.n.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 40);

  const row = document.createElement('div');
  row.className = 'row' + (data.k.length === 0 ? ' is-leaf' : '');

  const rowContent = document.createElement('div');
  rowContent.className = 'row-content';

  if (depth === 1) {
    const bar = document.createElement('span');
    bar.className = 'l1-bar';
    bar.style.background = l1Color;
    rowContent.appendChild(bar);
  }

  const toggle = document.createElement('span');
  toggle.className = 'toggle';
  toggle.textContent = data.k.length > 0 ? '▶' : '·';
  rowContent.appendChild(toggle);

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = data.n;
  rowContent.appendChild(label);

  if (data.c > 0) {
    const meta = document.createElement('span');
    meta.className = 'meta';
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = data.c;
    meta.appendChild(pill);
    rowContent.appendChild(meta);
  }

  row.appendChild(rowContent);

  if (data.k.length > 0) {
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      node.classList.toggle('is-open');
    });
  }

  node.appendChild(row);

  allNodes.push({
    el: node,
    labelEl: label,
    name: data.n,
    lower: data.n.toLowerCase(),
    depth,
    l1: l1Name,
  });

  if (data.k.length > 0) {
    const children = document.createElement('div');
    children.className = 'children';
    data.k.forEach(child => children.appendChild(renderNode(child, depth + 1, l1Name, l1Color)));
    node.appendChild(children);
  }

  return node;
}

TREE_DATA.forEach(root => {
  treeEl.appendChild(renderNode(root, 1, root.n, L1_COLORS[root.n] || '#08A2C0'));
});

// Set CSS header height variable for scroll offsets
function updateHeaderHeight() {
  const h = document.getElementById('mainHeader').offsetHeight;
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
updateHeaderHeight();
window.addEventListener('resize', updateHeaderHeight);

// Jump chips
const jumpsEl = document.getElementById('l1Jumps');
TREE_DATA.forEach(root => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'jump-chip';
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = L1_COLORS[root.n] || '#08A2C0';
  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(root.n));
  chip.addEventListener('click', () => {
    const target = allNodes.find(n => n.depth === 1 && n.name === root.n);
    if (target) {
      target.el.classList.add('is-open');
      const headerH = document.getElementById('mainHeader').offsetHeight;
      const top = target.el.getBoundingClientRect().top + window.pageYOffset - headerH - 8;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  });
  jumpsEl.appendChild(chip);
});

// Expand / Collapse
document.getElementById('expandAll').addEventListener('click', () => {
  allNodes.forEach(n => { if (n.el.querySelector('.children')) n.el.classList.add('is-open'); });
});
document.getElementById('collapseAll').addEventListener('click', () => {
  allNodes.forEach(n => n.el.classList.remove('is-open'));
});

updateHeaderHeight();

</script>
